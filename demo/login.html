<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; font-src 'none'; img-src 'none'">
<title>SeqShow — Offline presentation</title><style>* { box-sizing: border-box; }
body { margin: 0; background: #f4f6fa; color: #172338; font: 15px Arial, sans-serif; }
main { margin: 24px auto; max-width: 1120px; padding: 0 20px; }
h1 { margin: 0 0 8px; font-size: 28px; }
p { color: #53627a; line-height: 1.6; }
[data-controls] { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 18px 0; }
[data-controls] label { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
[data-controls] select { max-width: 100%; }
button, select { font: inherit; padding: 8px 12px; border: 1px solid #bac5d7; border-radius: 6px; background: white; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, select:focus-visible { outline: 3px solid #377fe8; outline-offset: 2px; }
button[aria-pressed="true"] { background: #e7f0ff; border-color: #377fe8; }
[data-other-path] { display: block; color: #475569; font-size: 12px; flex-basis: 100%; overflow-wrap: anywhere; }
[data-step-details] { font-size: 13px; color: #475569; overflow-wrap: anywhere; }
[data-status] { min-height: 46px; margin: 12px 0; font-weight: 600; overflow-wrap: anywhere; }
[data-diagram] { background: white; padding: 24px; border: 1px solid #dce3ed; border-radius: 12px; overflow: auto; max-height: 640px; }
.player-help { font-size: 13px; color: #475569; }
[data-player]:focus-visible { outline: 3px solid #377fe8; outline-offset: 3px; }
[data-diagram] > svg { display: block; min-width: 600px; width: 100%; height: auto; }
svg [data-phase="current"] { opacity: 1; }
svg text[data-phase="current"], svg [data-phase="current"] text { fill: #0755c7 !important; }
svg line[data-phase="current"], svg path[data-phase="current"] { stroke: #0755c7 !important; }
svg [data-phase="current"] rect.note { stroke: #0755c7 !important; stroke-width: 2px; }
svg[data-focus="true"] line[data-phase="past"], svg[data-focus="true"] path[data-phase="past"] { stroke: #64748b !important; }
svg[data-focus="true"] [data-phase="future"] { opacity: .85; }
svg [data-phase="inactive"] { opacity: .8; }
svg [data-seq-case][data-selected="false"] { opacity: .8; }
svg[data-focus="true"] [data-seq-participant][data-active="false"] { opacity: .85; }
svg [data-seq-participant][data-active="true"] rect { stroke: #0755c7 !important; }
@media (max-width: 600px) { main { padding: 0 12px; } [data-diagram] { padding: 12px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
